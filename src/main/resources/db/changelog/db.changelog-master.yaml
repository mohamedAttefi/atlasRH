databaseChangeLog:
  - changeSet:
      id: 001-create-atlasrh-tables
      author: atlasrh
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(500)

        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: matricule
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(180)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: position
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: hire_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: manager_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_employee_department

        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: manager_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_employee_manager

        - createTable:
            tableName: contracts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: contract_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: gross_salary
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: contracts
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_contract_employee

        - createTable:
            tableName: leave_types
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: days_per_year
                  type: INTEGER
                  constraints:
                    nullable: false

        - createTable:
            tableName: leave_requests
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: leave_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: EN_ATTENTE
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: VARCHAR(500)
              - column:
                  name: requested_days
                  type: INTEGER
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: leave_requests
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_leave_request_employee

        - addForeignKeyConstraint:
            baseTableName: leave_requests
            baseColumnNames: leave_type_id
            referencedTableName: leave_types
            referencedColumnNames: id
            constraintName: fk_leave_request_type

  - changeSet:
      id: 002-insert-leave-types
      author: atlasrh
      changes:
        - insert:
            tableName: leave_types
            columns:
              - column:
                  name: name
                  value: ANNUEL
              - column:
                  name: days_per_year
                  valueNumeric: 22
        - insert:
            tableName: leave_types
            columns:
              - column:
                  name: name
                  value: EXCEPTIONNEL
              - column:
                  name: days_per_year
                  valueNumeric: 3

  - changeSet:
      id: 003-demo-data
      author: atlasrh
      changes:
        - insert:
            tableName: departments
            columns:
              - column: { name: name, value: Ressources humaines }
              - column: { name: description, value: Département RH de démonstration }
        - insert:
            tableName: employees
            columns:
              - column: { name: matricule, value: AT-0001 }
              - column: { name: first_name, value: Nadia }
              - column: { name: last_name, value: Benali }
              - column: { name: email, value: nadia.benali@example.test }
              - column: { name: position, value: Responsable RH }
              - column: { name: hire_date, valueDate: '2020-01-15' }
              - column: { name: department_id, valueNumeric: 1 }

  - changeSet:
      id: 004-api-demo-data
      author: atlasrh
      comment: Add related records for exercising employee, contract, leave, and manager APIs.
      changes:
        - sql:
            sql: |
              INSERT INTO employees (matricule, first_name, last_name, email, position, hire_date, department_id, manager_id)
              SELECT 'AT-0002', 'Youssef', 'Alaoui', 'youssef.alaoui@example.test', 'Développeur', DATE '2022-04-11', d.id, m.id
              FROM departments d, employees m
              WHERE d.name = 'Ressources humaines' AND m.matricule = 'AT-0001';

              INSERT INTO employees (matricule, first_name, last_name, email, position, hire_date, department_id, manager_id)
              SELECT 'AT-0003', 'Salma', 'Idrissi', 'salma.idrissi@example.test', 'Analyste RH', DATE '2023-09-04', d.id, m.id
              FROM departments d, employees m
              WHERE d.name = 'Ressources humaines' AND m.matricule = 'AT-0001';

              INSERT INTO contracts (employee_id, contract_type, start_date, end_date, gross_salary, active)
              SELECT id, 'CDI', DATE '2020-01-15', NULL, 24000.00, true FROM employees WHERE matricule = 'AT-0001';
              INSERT INTO contracts (employee_id, contract_type, start_date, end_date, gross_salary, active)
              SELECT id, 'CDI', DATE '2022-04-11', NULL, 18000.00, true FROM employees WHERE matricule = 'AT-0002';
              INSERT INTO contracts (employee_id, contract_type, start_date, end_date, gross_salary, active)
              SELECT id, 'CDD', DATE '2023-09-04', DATE '2027-09-03', 16000.00, true FROM employees WHERE matricule = 'AT-0003';

              INSERT INTO leave_requests (employee_id, leave_type_id, start_date, end_date, reason, status, requested_days)
              SELECT e.id, t.id, DATE '2026-08-03', DATE '2026-08-07', 'Congé annuel de démonstration', 'APPROUVEE', 5
              FROM employees e, leave_types t WHERE e.matricule = 'AT-0002' AND t.name = 'ANNUEL';
              INSERT INTO leave_requests (employee_id, leave_type_id, start_date, end_date, reason, status, requested_days)
              SELECT e.id, t.id, DATE '2027-05-10', DATE '2027-05-12', 'Demande en attente de démonstration', 'EN_ATTENTE', 3
              FROM employees e, leave_types t WHERE e.matricule = 'AT-0002' AND t.name = 'ANNUEL';
              INSERT INTO leave_requests (employee_id, leave_type_id, start_date, end_date, reason, status, comment, requested_days)
              SELECT e.id, t.id, DATE '2026-10-05', DATE '2026-10-06', 'Congé exceptionnel de démonstration', 'REFUSEE', 'Période non disponible', 2
              FROM employees e, leave_types t WHERE e.matricule = 'AT-0003' AND t.name = 'EXCEPTIONNEL';
